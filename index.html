<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Portfólio</title>
    <style>
        /* Aqui fica a mágica das cores e do visual (CSS) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121214;
            color: #e1e1e6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .cartao {
            background-color: #202024;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            border-top: 4px solid #04d361;
        }
        h1 {
            color: #04d361;
            margin-bottom: 10px;
        }
        p {
            color: #a8a8b3;
            font-size: 18px;
        }
        .botao {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #04d361;
            color: #121214;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="cartao">
        <h1>Olá, Mundo! 🚀</h1>
        <p>Este é o meu primeiro projeto oficial no GitHub.</p>
        <p>Estou usando VS Code e aprendendo programação!</p>
        <a href="https://github.com" class="botao">Ver meu GitHub</a>
    </div>

</body>
</html>
